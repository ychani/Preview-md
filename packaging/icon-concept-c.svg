<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep graphite / charcoal -->
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#2c2c2e"/>
      <stop offset="100%" stop-color="#1c1c1e"/>
    </linearGradient>
    <!-- Orange-amber accent for # -->
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9f0a"/>
      <stop offset="100%" stop-color="#ff6b00"/>
    </linearGradient>
    <!-- Subtle warm highlight -->
    <radialGradient id="warmGlow" cx="38%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#ff9f0a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff9f0a" stop-opacity="0"/>
    </radialGradient>
    <filter id="hashGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="hashMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffbc4b"/>
      <stop offset="50%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#e55c00"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#warmGlow)"/>

  <!-- Thin inner border for depth -->
  <rect x="2" y="2" width="1020" height="1020" rx="218" fill="none"
    stroke="white" stroke-width="1.5" stroke-opacity="0.08"/>

  <!-- # symbol — amber/orange, center stage -->
  <g filter="url(#hashGlow)" transform="translate(512,490)">
    <!-- Vertical bars with slight 3-D bevel look via two rect layers -->
    <rect x="-162" y="-222" width="68" height="444" rx="34" fill="url(#hashMetal)" opacity="0.15"/>
    <rect x="-168" y="-228" width="68" height="444" rx="34" fill="url(#hashMetal)"/>

    <rect x="100"  y="-222" width="68" height="444" rx="34" fill="url(#hashMetal)" opacity="0.15"/>
    <rect x="100"  y="-228" width="68" height="444" rx="34" fill="url(#hashMetal)"/>

    <!-- Horizontal bars -->
    <rect x="-238" y="-100" width="476" height="68" rx="34" fill="url(#hashMetal)" opacity="0.15"/>
    <rect x="-238" y="-106" width="476" height="68" rx="34" fill="url(#hashMetal)"/>

    <rect x="-238" y="92"   width="476" height="68" rx="34" fill="url(#hashMetal)" opacity="0.15"/>
    <rect x="-238" y="88"   width="476" height="68" rx="34" fill="url(#hashMetal)"/>
  </g>

  <!-- Bottom MD label -->
  <text x="512" y="888"
    font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif"
    font-weight="700" font-size="48" fill="white" fill-opacity="0.28"
    text-anchor="middle" letter-spacing="12">MD</text>
</svg>

<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#1a56db"/>
      <stop offset="100%" stop-color="#0e1f6b"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#4f8fff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4f8fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="hashShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000520" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="hashGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d0e4ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#glow)"/>

  <!-- Subtle top-left highlight -->
  <ellipse cx="280" cy="260" rx="340" ry="280" fill="white" fill-opacity="0.05"/>

  <!-- The # symbol — hero element -->
  <g filter="url(#hashShadow)" transform="translate(512,490)">
    <!-- Vertical bars -->
    <rect x="-168" y="-230" width="72" height="460" rx="36" fill="url(#hashGrad)"/>
    <rect x="96"   y="-230" width="72" height="460" rx="36" fill="url(#hashGrad)"/>
    <!-- Horizontal bars -->
    <rect x="-240" y="-96"  width="480" height="72" rx="36" fill="url(#hashGrad)"/>
    <rect x="-240" y="96"   width="480" height="72" rx="36" fill="url(#hashGrad)"/>
  </g>

  <!-- Subtle bottom label: "MD" in small caps -->
  <text x="512" y="892"
    font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif"
    font-weight="700" font-size="52" fill="white" fill-opacity="0.35"
    text-anchor="middle" letter-spacing="14">MD</text>
</svg>
